<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Streetlevel screens</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0A0A0A; }
      /* react-native-web maps RN text onto these; the system stack keeps the
         rendering close to what a device would pick. */
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      #root { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./generated/bundle.js"></script>
  </body>
</html>
